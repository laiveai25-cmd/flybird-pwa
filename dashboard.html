<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Flybird Inspections — Dashboard</title>
<style>
  :root{--navy:#071A5A;--mint:#8CC8BE;--gold:#C9A84C;--cream:#F7F2EC;--ink:#0d1526;
    --muted:#5a6577;--line:#dfe3ea;--card:#fff;--bg:#eef0f4;--green:#2E8B6F;--red:#B23A48;
    --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--ui);background:var(--bg);color:var(--ink)}
  header{background:var(--navy);color:#fff;padding:16px 22px;display:flex;align-items:center;gap:12px}
  .logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--mint),var(--gold));
    display:grid;place-items:center;font-weight:800;color:var(--navy)}
  header h1{font-size:17px;margin:0}
  header .sub{font-size:12px;color:var(--mint);font-family:var(--mono)}
  main{max-width:1150px;margin:0 auto;padding:22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}

  /* Gate */
  #gate{max-width:420px;margin:60px auto}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 5px}
  input,select{width:100%;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
  .btn{font-size:14px;font-weight:700;border:none;border-radius:10px;padding:11px 18px;cursor:pointer;background:var(--navy);color:#fff}
  .btn.ghost{background:var(--cream);color:var(--navy);border:1px solid var(--line)}
  .btn:disabled{opacity:.5;cursor:default}
  .msg{font-size:12px;margin-top:10px;min-height:16px;color:var(--red)}

  /* Filters */
  .filters{display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:12px;align-items:end}
  @media(max-width:820px){.filters{grid-template-columns:1fr 1fr}}
  .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;flex-wrap:wrap}
  .count{font-family:var(--mono);font-size:13px;color:var(--muted)}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;background:var(--navy);color:#fff;padding:9px 11px;position:sticky;top:0}
  td{padding:9px 11px;border-bottom:1px solid var(--line)}
  tr:hover td{background:#f7f9fc}
  .mono{font-family:var(--mono)}
  .pill{font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .serv{background:rgba(46,139,111,.14);color:var(--green)}
  .unserv{background:rgba(178,58,72,.14);color:var(--red)}
  .empty{text-align:center;color:var(--muted);padding:34px}
  .tblwrap{overflow:auto;max-height:62vh;border:1px solid var(--line);border-radius:10px}
</style>
</head>
<body>
<header>
  <div class="logo">F</div>
  <div><h1>Flybird Inspections — Dashboard</h1><div class="sub">Read-only · Operations</div></div>
</header>

<main>
  <!-- GATE -->
  <div id="gate" class="card">
    <h2 style="margin-top:0;color:var(--navy)">Enter access code</h2>
    <p style="font-size:13px;color:var(--muted)">This dashboard is read-only and restricted to authorised operations staff.</p>
    <label>Access code</label>
    <input id="token" type="password" placeholder="••••••••" autocomplete="off">
    <button class="btn" id="unlock" style="width:100%;margin-top:12px">Unlock</button>
    <div class="msg" id="gateMsg"></div>
  </div>

  <!-- APP -->
  <div id="app" style="display:none">
    <div class="card">
      <div class="filters">
        <div><label>From (inspection date)</label><input id="from" type="date"></div>
        <div><label>To (inspection date)</label><input id="to" type="date"></div>
        <div><label>Aircraft</label><select id="reg"><option value="all">All aircraft</option></select></div>
        <div><label>Status</label>
          <select id="status">
            <option value="all">All</option>
            <option value="Serviceable">Serviceable</option>
            <option value="Unserviceable">Unserviceable</option>
          </select>
        </div>
        <div><button class="btn" id="load">Apply</button></div>
      </div>
    </div>

    <div class="card">
      <div class="bar">
        <div class="count" id="count">—</div>
        <div style="display:flex;gap:10px">
          <button class="btn ghost" id="signout">Sign out</button>
          <button class="btn" id="csv">⬇ Download CSV</button>
        </div>
      </div>
      <div class="tblwrap">
        <table>
          <thead><tr>
            <th>Date</th><th>Type</th><th>Aircraft</th><th>Engineer</th>
            <th>Status</th><th>Reason (if U/S)</th><th>Emailed</th>
          </tr></thead>
          <tbody id="rows"><tr><td colspan="7" class="empty">Apply a filter to load inspections.</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script>
let TOKEN = sessionStorage.getItem("fb_dash") || "";
let DATA = [];
const $=s=>document.querySelector(s);

function showApp(){ $("#gate").style.display="none"; $("#app").style.display="block"; load(); }

$("#unlock").addEventListener("click",async()=>{
  const t=$("#token").value.trim();
  if(!t){ $("#gateMsg").textContent="Enter the access code."; return; }
  $("#gateMsg").style.color="var(--muted)"; $("#gateMsg").textContent="Checking…";
  // Validate by making a real (empty-ish) request.
  const ok=await tryLoad(t);
  if(ok){ TOKEN=t; sessionStorage.setItem("fb_dash",t); showApp(); }
  else { $("#gateMsg").style.color="var(--red)"; $("#gateMsg").textContent="Incorrect access code."; }
});
$("#token").addEventListener("keydown",e=>{ if(e.key==="Enter") $("#unlock").click(); });

$("#signout").addEventListener("click",()=>{
  TOKEN=""; sessionStorage.removeItem("fb_dash");
  $("#app").style.display="none"; $("#gate").style.display="block"; $("#token").value="";
});

async function tryLoad(token){
  try{
    const p=new URLSearchParams({token});
    ["from","to"].forEach(k=>{ if($("#"+k)&&$("#"+k).value) p.set(k,$("#"+k).value); });
    const reg=$("#reg")?$("#reg").value:"all"; if(reg&&reg!=="all") p.set("registration",reg);
    const st=$("#status")?$("#status").value:"all"; if(st&&st!=="all") p.set("airworthy",st);
    const r=await fetch("/api/submissions?"+p.toString());
    if(r.status===401) return false;
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||"error");
    DATA=d.rows||[];
    render();
    return true;
  }catch(e){ return false; }
}
async function load(){ await tryLoad(TOKEN); }
$("#load").addEventListener("click",load);

function render(){
  // Populate aircraft dropdown from data (keep current selection).
  const sel=$("#reg"), cur=sel.value;
  const regs=[...new Set(DATA.map(r=>r.registration).filter(Boolean))].sort();
  sel.innerHTML='<option value="all">All aircraft</option>'+regs.map(x=>`<option>${x}</option>`).join("");
  sel.value=[...sel.options].some(o=>o.value===cur)?cur:"all";

  $("#count").textContent=`${DATA.length} inspection${DATA.length===1?"":"s"}`;
  const tb=$("#rows");
  if(!DATA.length){ tb.innerHTML='<tr><td colspan="7" class="empty">No inspections match these filters.</td></tr>'; return; }
  tb.innerHTML=DATA.map(r=>{
    const st=r.airworthy==="Serviceable"?'<span class="pill serv">Serviceable</span>'
      :r.airworthy==="Unserviceable"?'<span class="pill unserv">Unserviceable</span>':"—";
    const emailed=r.emailed_at?"✓":"—";
    return `<tr>
      <td class="mono">${r.date||"—"}</td>
      <td>${r.check_type||"—"}</td>
      <td class="mono">${r.registration||"—"}</td>
      <td>${r.engineer||"—"}</td>
      <td>${st}</td>
      <td>${r.unserviceable_reason?escapeHtml(r.unserviceable_reason):""}</td>
      <td style="text-align:center">${emailed}</td>
    </tr>`;
  }).join("");
}
function escapeHtml(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

$("#csv").addEventListener("click",()=>{
  if(!DATA.length){ alert("Nothing to export — load some inspections first."); return; }
  const cols=["date","check_type","registration","engineer","airworthy","unserviceable_reason","created_at","emailed_at","id"];
  const head=["Inspection Date","Type","Aircraft","Engineer","Status","Reason","Submitted","Emailed","Submission ID"];
  const esc=v=>{ v=(v==null?"":String(v)); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const csv=[head.join(",")].concat(DATA.map(r=>cols.map(c=>esc(r[c])).join(","))).join("\n");
  const blob=new Blob([csv],{type:"text/csv"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`flybird_inspections_${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
});

// Auto-enter if a code is already remembered this session.
if(TOKEN){ tryLoad(TOKEN).then(ok=>{ if(ok) showApp(); else sessionStorage.removeItem("fb_dash"); }); }
</script>
</body>
</html>
